<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理システム - 勤怠データ出力</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/data-manager.js"></script>
    <script src="js/api-client.js"></script>
</head>
<body>
    <div class="header">
        <h1>シフト管理システム - 勤怠データ出力</h1>
    </div>

    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #2c3e50;">勤怠データ出力</h2>
                <a href="admin.html" class="btn btn-secondary">戻る</a>
            </div>

            <div id="error-message" class="alert alert-danger" style="display: none;"></div>

            <div id="warning-message" class="alert alert-warning" style="display: none; background: #fff3cd; border: 1px solid #ffe08a; color: #856404; padding: 10px; border-radius: 4px; margin-bottom: 15px;"></div>

            <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px;">
                <div class="form-group" style="margin: 0;">
                    <label for="start-date">開始日</label>
                    <input type="date" id="start-date" class="form-control">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="end-date">終了日</label>
                    <input type="date" id="end-date" class="form-control">
                </div>
                <button id="preview-btn" class="btn btn-primary">表示</button>
                <button id="export-btn" class="btn btn-success">勤怠データ出力（kinmu.txt）</button>
            </div>

            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 15px;">
                <span style="font-size: 12px; color: #7f8c8d;">期間の簡単指定:</span>
                <button class="btn btn-secondary preset-btn" data-preset="prev16" style="padding: 4px 10px; font-size: 12px;">前月16日〜当月15日</button>
                <button class="btn btn-secondary preset-btn" data-preset="cur16" style="padding: 4px 10px; font-size: 12px;">当月16日〜翌月15日</button>
                <button class="btn btn-secondary preset-btn" data-preset="curMonth" style="padding: 4px 10px; font-size: 12px;">当月1日〜末日</button>
                <button class="btn btn-secondary preset-btn" data-preset="prevMonth" style="padding: 4px 10px; font-size: 12px;">前月1日〜末日</button>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; color: #34495e;">
                    <input type="checkbox" id="fallback-code"> 勤怠コード未設定の従業員は、従業員コードを社員CDとして出力する
                </label>
            </div>

            <p style="font-size: 12px; color: #7f8c8d;">
                ※出力形式は kinmu.txt（カンマ区切り・CRLF）。項目: 社員CD, 日付(yyyymmdd), 勤務区分, 事由1, 出勤, 退勤。
                時刻は分(hour×60+min)、事由「休憩なし」=21 で出力します。社員CD（勤怠コード）未設定の従業員は、上記チェックを入れない限り出力されません。
            </p>

            <div id="attendance-table"></div>
        </div>
    </div>

    <script src="js/attendance-export.js"></script>
</body>
</html>
