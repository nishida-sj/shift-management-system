<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理システム - タイムカード</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/data-manager.js"></script>
    <script src="js/api-client.js"></script>
</head>
<body>
    <div class="header">
        <h1>シフト管理システム - タイムカード</h1>
    </div>

    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #2c3e50;">個人別タイムカード</h2>
                <a href="admin.html" class="btn btn-secondary">戻る</a>
            </div>

            <div id="error-message" class="alert alert-danger" style="display: none;"></div>

            <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px;">
                <div class="form-group" style="margin: 0;">
                    <label for="employee-select">従業員</label>
                    <select id="employee-select" class="form-control"></select>
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="start-date">開始日</label>
                    <input type="date" id="start-date" class="form-control">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="end-date">終了日</label>
                    <input type="date" id="end-date" class="form-control">
                </div>
                <button id="show-btn" class="btn btn-primary">表示</button>
                <button id="print-btn" class="btn btn-success">印刷</button>
            </div>

            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 15px;">
                <span style="font-size: 12px; color: #7f8c8d;">期間の簡単指定:</span>
                <button class="btn btn-secondary preset-btn" data-preset="prev16" style="padding: 4px 10px; font-size: 12px;">前月16日〜当月15日</button>
                <button class="btn btn-secondary preset-btn" data-preset="cur16" style="padding: 4px 10px; font-size: 12px;">当月16日〜翌月15日</button>
                <button class="btn btn-secondary preset-btn" data-preset="curMonth" style="padding: 4px 10px; font-size: 12px;">当月1日〜末日</button>
                <button class="btn btn-secondary preset-btn" data-preset="prevMonth" style="padding: 4px 10px; font-size: 12px;">前月1日〜末日</button>
            </div>

            <p style="font-size: 12px; color: #7f8c8d;">
                ※「時間」は退勤−出勤の打刻時間です（休憩時間は打刻していないため差し引いていません）。
                事由「休憩なし」が付いた日は事由欄に表示されます。
            </p>

            <div id="timecard-container"></div>
        </div>
    </div>

    <script src="js/attendance-timecard.js"></script>
</body>
</html>
