<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理システム - 勤怠申請の承認</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/data-manager.js"></script>
    <script src="js/api-client.js"></script>
</head>
<body>
    <div class="header">
        <h1>シフト管理システム - 勤怠申請の承認</h1>
    </div>

    <div class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #2c3e50;">勤怠申請の承認</h2>
                <a href="admin.html" class="btn btn-secondary">戻る</a>
            </div>

            <div id="approval-message" class="alert" style="display: none; margin-bottom: 15px;"></div>

            <p style="font-size: 12px; color: #7f8c8d; margin-bottom: 15px;">
                従業員から申請された打刻の修正内容です。承認すると打刻データに反映されます。
            </p>

            <div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px;">
                <div class="form-group" style="margin: 0;">
                    <label for="status-filter">表示</label>
                    <select id="status-filter" class="form-control">
                        <option value="pending">未承認のみ</option>
                        <option value="approved">承認済み</option>
                        <option value="rejected">却下</option>
                        <option value="">すべて</option>
                    </select>
                </div>
                <button type="button" id="reload-btn" class="btn btn-primary">再読み込み</button>
            </div>

            <div id="approval-list-container"></div>
        </div>
    </div>

    <script src="js/attendance-approval.js"></script>
</body>
</html>
